# Publishes the gem to RubyGems when a v* tag is pushed, via RubyGems
# trusted publishing (OIDC) — no API key, no OTP prompt.
#
# One-time setup on rubygems.org. Before the first release the gem doesn't
# exist yet, so add a *pending* trusted publisher:
#   Profile → Trusted publishers → Create → gem name: noticed-telegram,
#   repository: yshmarov/noticed-telegram, workflow: release.yml,
#   environment: release
#
# Release flow after that:
#   git tag v0.x.y && git push origin v0.x.y
#
# We configure the OIDC credentials and then build + push directly, rather than
# using rubygems/release-gem (which can publish successfully and then fail while
# running the surrounding release task).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Verify tag matches gem version
        run: |
          version="$(ruby -Ilib -r noticed/telegram/version -e 'print Noticed::Telegram::VERSION')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Validate release
        run: |
          bundle exec rake test
          bundle exec rubocop
          gem build noticed-telegram.gemspec
      - name: Check whether this version is already published
        id: release
        env:
          GEM_NAME: noticed-telegram
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ruby -rjson -rnet/http -ruri -e '
            name, version = ARGV
            uri = URI("https://rubygems.org/api/v1/versions/#{name}.json")
            versions = JSON.parse(Net::HTTP.get(uri))
            exit(versions.any? { |item| item.fetch("number") == version } ? 0 : 1)
          ' "$GEM_NAME" "$version"
          then
            echo "$GEM_NAME $version is already published; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      # Same exchange as rubygems/configure-rubygems-credentials, plus `owner`:
      # RubyGems only lets trusted publishing create a *new* gem when the
      # workflow names the owning account, and no released version of that
      # action accepts an owner yet. 193104 is the immutable RubyGems user ID
      # shown on the Pending Trusted Publishers page.
      - name: Exchange the OIDC token for a RubyGems API key
        if: steps.release.outputs.needed == 'true'
        env:
          RUBYGEMS_OWNER_ID: "193104"
        run: |
          jwt="$(curl -sS --fail-with-body \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)"
          echo "::add-mask::$jwt"
          key="$(curl -sS --fail-with-body -X POST \
            https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg jwt "$jwt" --arg owner "$RUBYGEMS_OWNER_ID" '{jwt: $jwt, owner: $owner}')" \
            | jq -r .rubygems_api_key)"
          test -n "$key" && test "$key" != "null"
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build and push the gem
        if: steps.release.outputs.needed == 'true'
        run: |
          gem push noticed-telegram-*.gem
      - name: Verify the published version
        env:
          GEM_NAME: noticed-telegram
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 12)
          do
            if ruby -rjson -rnet/http -ruri -e '
              name, version = ARGV
              uri = URI("https://rubygems.org/api/v1/versions/#{name}.json")
              # A brand-new gem answers in plain text ("could not be found") until indexed.
              versions = JSON.parse(Net::HTTP.get(uri)) rescue []
              exit(versions.any? { |item| item.fetch("number") == version } ? 0 : 1)
            ' "$GEM_NAME" "$version"
            then
              exit 0
            fi
            echo "RubyGems has not indexed $GEM_NAME $version yet (attempt $attempt/12)."
            sleep 10
          done
          exit 1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1
          then
            echo "$GITHUB_REF_NAME already has a GitHub release."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "noticed-telegram $GITHUB_REF_NAME"
          fi
